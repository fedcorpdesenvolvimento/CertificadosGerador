# Blueprint do Render para a area de TESTE: tela com login + API do portal — docs/DEPLOY-RENDER.md.
# Importar em render.com > New > Blueprint apontando para este repositorio.
# Os valores marcados sync: false sao preenchidos no painel do Render (nunca aqui — SEC-01).
services:
  - type: web
    name: certgen-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Mesma regiao do bucket (AWS us-east-2); o Render nao tem regiao no Brasil.
    region: ohio
    # Starter (512 MB) costuma bastar para um Chromium por chamada; se aparecer
    # "Out of memory" no log da emissao, subir para standard.
    plan: starter
    # Rota publica da tela (ADR-08); /v1/saude exige X-API-Key (RN-30).
    healthCheckPath: /api/saude
    autoDeploy: true
    # ADR-08: usuarios e sessoes em SQLite. Sem disco o arquivo some a cada deploy (o ADMIN e
    # semeado de novo, mas os usuarios criados pela tela se perdem).
    disk:
      name: dados
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: CERTGEN_REPOSITORIO
        value: firebird
      # Firebird 2.5 — alcancado pelo tunel/encaminhamento descrito em docs/DEPLOY-RENDER.md
      - key: FB_HOST
        sync: false
      - key: FB_PORT
        sync: false
      - key: FB_DATABASE
        sync: false
      - key: FB_USER
        sync: false
      - key: FB_PASSWORD
        sync: false
      - key: FB_CHARSET
        value: WIN1252
      - key: FB_POOL_SIZE
        value: "5"
      # ADR-09 — chaves da API cadastradas na tela (CHAVES DA API). Esta variavel e opcional e
      # de transicao (acesso a todas as administradoras); deixe em branco depois de cadastrar.
      - key: CERTGEN_API_KEY
        sync: false
      # ADR-09 — validade da URL assinada do PDF (segundos)
      - key: CERTGEN_LINK_VALIDADE_SEG
        value: "900"
      # RN-25 e RN-22
      - key: CERTGEN_SUSEP_CORRETORA
        value: "00000202049583"
      - key: CERTGEN_APOLICES_MASSA
        value: "4008,5008,10008,13008,14008,15008"
      # RN-29 / RF-21 — publicacao no S3
      - key: AWS_REGION
        value: us-east-2
      - key: AWS_S3_BUCKET
        value: certincendioaws
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CERTGEN_PASTA_SAIDA
        value: /app/saida
      # ADR-08 — login da tela
      - key: CERTGEN_ADMIN_EMAIL
        value: alberto@grupofedcorp.com.br
      - key: CERTGEN_ADMIN_SENHA
        sync: false
      - key: CERTGEN_USUARIOS_DB
        value: /data/usuarios.sqlite
