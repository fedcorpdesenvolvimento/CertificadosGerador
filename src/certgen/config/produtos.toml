# RN-03 / RN-03.1 / RN-03.2 — derivacao do produto a partir da apolice
#
# Fonte: UfrmImprimeCertInc.pas linhas 776-812 (fluxo em massa, mapa completo)
#        e 1221-1233 (fluxo manual, mapa incompleto — origem de DEF-09).
# Este arquivo adota a UNIAO dos dois mapas: o fluxo manual do legado nao
# conhecia 9008, 10008, 14008 nem 15008, e emitia com produto vazio ou
# herdado da selecao anterior.
#
# Catalogo autoritativo: comentario das linhas 1202-1208 do .pas.

[[produto]]
codigo          = "0001"
descricao       = "Incendio Conteudo Residencial"
descricao_curta = "RESIDENCIAL"
locacao         = false

[[produto]]
codigo          = "0002"
descricao       = "Incendio Conteudo Comercial"
descricao_curta = "COMERCIAL"
locacao         = false

# GAP-14 — existe no dominio, nao era emissivel pela tela legada.
# O rotulo GARANTIA no template da apolice 15008 sugere que tem lugar no
# layout. Decidir se o sistema novo contempla.
[[produto]]
codigo          = "0003"
descricao       = "Garantia do Condominio"
descricao_curta = "GARANTIA"
locacao         = false
emissivel       = false

[[produto]]
codigo          = "0004"
descricao       = "Ruptura de Encanamento + Incendio Conteudo"
descricao_curta = "RUPTURA"
locacao         = false

# GAP-14 — idem 0003.
[[produto]]
codigo          = "0005"
descricao       = "Aluguel"
descricao_curta = "ALUGUEL"
locacao         = false
emissivel       = false

[[produto]]
codigo          = "0006"
descricao       = "Locacao Residencial"
descricao_curta = "LOC-RES"
