[[produto]]
codigo          = "0007"
descricao       = "Locacao Comercial"
descricao_curta = "LOC-COM"
locacao         = true


# ---------------------------------------------------------------------------
# Mapa apolice -> produto.
#
# Resolucao: a regra MAIS ESPECIFICA vence. Uma regra com `administradora`
# preenchida tem precedencia sobre a regra so por `apolice` (RN-03.2).
# Apolice sem regra correspondente DEVE abortar a emissao nomeando a apolice
# (RN-03.3). Nao herdar produto da selecao anterior, nao deixar vazio.
# ---------------------------------------------------------------------------

[[regra]]
apolice = "4008"
produto = "0001"

[[regra]]
apolice = "9008"
produto = "0001"

[[regra]]
apolice = "10008"
produto = "0001"

[[regra]]
apolice = "5008"
produto = "0002"

[[regra]]
apolice = "13008"
produto = "0004"

[[regra]]
apolice = "14008"
produto = "0004"

[[regra]]
apolice = "15008"
produto = "0004"

# RN-03.1 — excecao real de negocio, linha 785 do .pas:
#   if ((Edit1.Text = '0000000019') and (apol = '15008')) then
#      ComboBox4.ItemIndex := 0 ;
# Preservada como dado. Emissoes por esta regra DEVEM registrar o aviso
# PRODUTO_POR_EXCECAO em _meta.avisos (RD-23).
[[regra]]
apolice        = "15008"
administradora = "0000000019"
produto        = "0001"
motivo         = "RN-03.1 — excecao especifica desta administradora"

[[regra]]
apolice = "6008"
produto = "0006"

[[regra]]
apolice = "7008"
produto = "0007"
