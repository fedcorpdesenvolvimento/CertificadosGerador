<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Gerador de Certificados{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css?v={{ v }}">
</head>
<body>
<header class="topo">
  <a class="marca" href="/">Gerador de Certificados</a>
  <nav>
    {% for m in modulos %}
    <a href="/{{ m.slug }}" class="{{ 'ativo' if m.ativo else 'inativo' }}">{{ m.titulo }}</a>
    {% endfor %}
    {% if usuario and usuario.admin %}<a href="/usuarios" class="ativo">USUÁRIOS</a><a href="/chaves" class="ativo">CHAVES DA API</a>{% endif %}
  </nav>
  {% if usuario %}
  <span class="sessao">
    <span class="quem" title="{{ usuario.perfil_nome if usuario.perfil_nome is defined else usuario.perfil }}">{{ usuario.nome }}</span>
    <a href="/trocar-senha" class="link-topo">Trocar senha</a>
    <button id="logout" class="botao-topo" type="button" title="Encerra a sessão deste usuário">Sair</button>
  </span>
  {% endif %}
  <span class="versao">v{{ versao }}</span>
</header>
<main>
{% block conteudo %}{% endblock %}
</main>
<script src="/static/sessao.js?v={{ v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
