{% extends "base.html" %}
{% block titulo %}Menu — Gerador de Certificados{% endblock %}
{% block conteudo %}
<h1>Escolha o tipo de certificado</h1>
<div class="cartoes">
  {% for m in modulos %}
  <a class="cartao {{ 'disponivel' if m.ativo else 'preparacao' }}" href="/{{ m.slug }}">
    <h2>{{ m.titulo }}</h2>
    <p>{{ m.descricao }}</p>
    <span class="etiqueta">{{ 'Disponível' if m.ativo else 'Em preparação' }}</span>
  </a>
  {% endfor %}
</div>
{% endblock %}
